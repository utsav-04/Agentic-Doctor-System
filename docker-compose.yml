version: "3.8"

services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379"   # Redis server
      - "8001:8001"   # RedisInsight UI
    command: ["redis-server", "--protected-mode", "no"]
    volumes:
      - redis_data:/data  
    restart: unless-stopped

volumes:
  redis_data:
